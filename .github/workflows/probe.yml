# Runner probe, on a diagnostic branch only (never merged): what the hosted runner gives the test suite.
# Round 1 (commit 17dfc3e) measured the CPU topology, the start-up of the workers and the sweeps with 1 to 4 workers.
# Round 2, on one machine per system: the suite of v2.0.13 and the suite of this commit (sweeps submitted when their
# module is loaded), each with the job's default temporary folder and with a folder under the runner's temporary
# folder; then the scenarios, the development evaluation and the rebuild with each of the two folders, with the
# entries each step leaves behind. Nothing here changes the pack; ci.yml runs as usual.
# Fix of round 2: GNU tar reads a path with a drive letter as a remote host, so it extracts in the current folder.
name: probe
on:
  push:
    branches: [aetherneum/runner-probe-2026-10-02]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]  # round 2 fix: the ubuntu-latest job of 06ec94f ran in full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      PROBE_PRINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install from the hashed lockfile
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Topology
        run: python probe/runner_probe.py topology
      - name: The code of v2.0.13 in a folder of its own (main 7dde2ff, no git metadata)
        run: mkdir -p "$RUNNER_TEMP/v2013" && cd "$RUNNER_TEMP/v2013" && git -C "$GITHUB_WORKSPACE" archive 7dde2ff | tar -x
      - name: Suite of v2.0.13, default temporary folder
        run: bash probe/round2.sh suite13 s13-system system
      - name: Suite of this commit, default temporary folder
        run: bash probe/round2.sh suite14 s14-system system
      - name: Suite of v2.0.13, runner temporary folder
        run: bash probe/round2.sh suite13 s13-work work
      - name: Suite of this commit, runner temporary folder
        run: bash probe/round2.sh suite14 s14-work work
      - name: Scenarios, default temporary folder
        run: bash probe/round2.sh scenarios scen-system system
      - name: Scenarios, runner temporary folder
        run: bash probe/round2.sh scenarios scen-work work
      - name: Development evaluation, default temporary folder
        run: bash probe/round2.sh eval eval-system system
      - name: Development evaluation, runner temporary folder
        run: bash probe/round2.sh eval eval-work work
      - name: Rebuild, default temporary folder
        run: bash probe/round2.sh rebuild rebuild-system system
      - name: Rebuild, runner temporary folder
        run: bash probe/round2.sh rebuild rebuild-work work
